name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build app, dmg and zip
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.${GITHUB_RUN_NUMBER}"
          fi
          bash build.sh "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: Pips
          path: |
            build/Pips.dmg
            build/Pips.zip
            build/SHA256SUMS.txt

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/Pips.dmg build/Pips.zip build/SHA256SUMS.txt --generate-notes
