name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build app, dmg and zip
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.${GITHUB_RUN_NUMBER}"
          fi
          bash macos/build.sh "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: Pips-macOS
          path: |
            macos/build/Pips.dmg
            macos/build/Pips.zip

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - name: Test and build
        shell: bash
        run: |
          # same version as the macOS build: the tag without "v", else 0.0.<run number>
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export PIPS_VERSION="${GITHUB_REF_NAME#v}"
          else
            export PIPS_VERSION="0.0.${GITHUB_RUN_NUMBER}"
          fi
          cargo test
          cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: Pips-Windows
          path: windows/target/release/pips.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum Pips.dmg Pips.zip pips.exe > SHA256SUMS.txt
          # a release made in the GitHub web UI already exists: just attach the files to it
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes
          gh release upload "$GITHUB_REF_NAME" Pips.dmg Pips.zip pips.exe SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
