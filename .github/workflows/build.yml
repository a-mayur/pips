name: Build

# runs only when a version tag is pushed (or a release is published with a new tag)
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build app, dmg and zip
        run: bash macos/build.sh "${GITHUB_REF_NAME#v}"  # v1.0.1 -> 1.0.1

      - uses: actions/upload-artifact@v4
        with:
          name: Pips-macOS
          path: |
            macos/build/Pips.dmg
            macos/build/Pips.zip

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - name: Test and build
        shell: bash
        run: |
          export PIPS_VERSION="${GITHUB_REF_NAME#v}"  # same version as the macOS build
          cargo test
          cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: Pips-Windows
          path: windows/target/release/pips.exe

  release:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum Pips.dmg Pips.zip pips.exe > SHA256SUMS.txt
          # a release made in the GitHub web UI already exists: just attach the files to it
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes
          gh release upload "$GITHUB_REF_NAME" Pips.dmg Pips.zip pips.exe SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
